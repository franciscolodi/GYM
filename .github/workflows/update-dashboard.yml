name: Update Dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/gym_sessions.csv"
      - "scripts/generate_dashboard.py"

  schedule:
    # 15:00 Chile = 18:00 UTC
    - cron: "0 18 * * *"

    # 22:00 Chile = 01:00 UTC del día siguiente
    - cron: "0 1 * * *"

  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
