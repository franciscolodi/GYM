name: Update Gym Sessions

on:
  push:
    paths:
      - "gym_events/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process gym events into sessions CSV
        run: python scripts/process_gym_sessions.py

      - name: Commit updated CSV
        run: |
          git config user.name "gym-bot"
          git config user.email "gym-bot@users.noreply.github.com"
          git add data/gym_sessions.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en gym_sessions.csv"
          else
            git commit -m "chore: actualizar gym_sessions.csv [skip ci]"
            git push
          fi
